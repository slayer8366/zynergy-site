<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Zynergy Labs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/forager-icon.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/assets/forager-icon.png">
<!--
  The site's not-found page. Cloudflare Pages serves this file, with status 404, for any path
  that matches no file, no _redirects rule and no Function route (Forager RECORD -2194; before
  it existed, every such path got the home page with status 200). Links are written from the
  site root because this page is served at any depth. noindex because Pages also serves it at
  /404 as an ordinary page.
-->
<style>
  :root {
    --forest: #2e5339;
    --cream: #ede3d0;
    --bg: #fbfbf9;
    --fg: #1a1a18;
    --muted: #6b6b64;
    --rule: #e3e3dd;
    --accent: var(--forest);
    --accent-fg: var(--cream);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121412;
      --fg: #ecece6;
      --muted: #9a9a92;
      --rule: #2a2c2a;
      --accent: #6fb69f;
      --accent-fg: #0e1a14;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 48px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.65 ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 32rem; }
  h1 {
    margin: 0 0 .3rem;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .rule { width: 3rem; height: 2px; background: var(--accent); margin: 1.3rem 0; border: 0; }
  p { margin: 0 0 1.1rem; color: var(--muted); }
  a { color: var(--accent); }
  .cta {
    display: inline-block;
    font-weight: 600;
    padding: .7rem 1.4rem;
    color: var(--accent-fg);
    background: var(--accent);
    border-radius: 6px;
    text-decoration: none;
  }
  .cta:hover { opacity: .9; }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <hr class="rule">
    <p>There is no page at this address. It may have moved, or the address may be mistyped.</p>
    <p><a class="cta" href="/">Go to the home page</a></p>
    <p>Looking for the app? Read <a href="/Forager/">about Forager</a>.</p>
  </main>
</body>
</html>
