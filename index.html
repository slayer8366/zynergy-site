<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zynergy Labs</title>
<meta name="description" content="Zynergy Labs builds Forager, a private foraging companion for Android.">
<link rel="icon" href="/assets/forager-icon.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/assets/forager-icon.png">
<meta property="og:title" content="Zynergy Labs">
<meta property="og:description" content="Zynergy Labs builds Forager, a private foraging companion for Android.">
<meta property="og:url" content="https://zynergy-labs.com/">
<meta property="og:type" content="website">
<!--
  Holding page for the business splash. Kept deliberately small so replacing it is a
  rewrite of one file and not an unpicking: the signup page lives at /beta-signup/ and
  the app page is intended for /forager, so neither depends on anything here.

  It matters that this file is small for a second reason. Cloudflare serves this page for
  every unmatched path on the site, so whatever is here is also what a mistyped URL shows.
-->
<style>
  :root {
    --forest: #2e5339;
    --cream: #ede3d0;
    --rust: #c97b3d;
    --bg: #fbfbf9;
    --fg: #1a1a18;
    --muted: #6b6b64;
    --rule: #e3e3dd;
    --accent: var(--forest);
    --accent-fg: var(--cream);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121412;
      --fg: #ecece6;
      --muted: #9a9a92;
      --rule: #2a2c2a;
      --accent: #6fb69f;
      --accent-fg: #0e1a14;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 48px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.65 ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 32rem; }
  img { display: block; max-width: 100%; }
  h1 {
    margin: 0 0 .3rem;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .rule { width: 3rem; height: 2px; background: var(--accent); margin: 1.3rem 0; border: 0; }
  p { margin: 0 0 1.1rem; color: var(--muted); }

  .product { display: flex; align-items: center; gap: 1rem; margin: 1.8rem 0 1.4rem; }
  .product img { width: 58px; height: 58px; border-radius: 13px; flex: none; }
  .product h2 { margin: 0 0 .15rem; font-size: 1.05rem; font-weight: 600; color: var(--fg); }
  .product p { margin: 0; font-size: .93rem; }

  .cta {
    display: inline-block;
    font-weight: 600;
    padding: .7rem 1.4rem;
    color: var(--accent-fg);
    background: var(--accent);
    border-radius: 6px;
    text-decoration: none;
  }
  .cta:hover { opacity: .9; }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer {
    margin-top: 2.6rem;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
    font-size: .88rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>Zynergy Labs</h1>
    <hr class="rule">

    <div class="product">
      <img src="/assets/forager-icon.png" width="512" height="512" alt="">
      <div>
        <h2>Forager</h2>
        <p>A private foraging companion for Android. Record your walks, log your finds, works offline.</p>
      </div>
    </div>

    <p>Forager is in a closed test and we are looking for people who actually go out looking for things.</p>

    <p><a class="cta" href="/beta-signup/">Join the beta</a></p>

    <footer>
      <a href="/privacy/">Privacy policy</a> ·
      <a href="mailto:support@zynergy-labs.com">support@zynergy-labs.com</a>
    </footer>
  </main>
</body>
</html>
